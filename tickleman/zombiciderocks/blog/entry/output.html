<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<title>ZR. |{title.ucwords}|</title>
</head>

	<div class="blog entry output">

		<ul class="actions"><li><a href="app://{@link('edit')}" target="#main">|edit|</a></li></ul>

		<h2>{title}</h2>

		<!--mainImage?-->
		<img alt="|main|" class="main" src="app://{mainImage.link}?width=400" title="{?caption}">
		<!--end-->
		<img alt="|side|" class="side" src="../img/zombivant-phal.png">
		<p>
			{story}
		</p>

		<ul class="images">
			<!--secondaryImages-->
			<li><img alt="|secondary image|" src="app://{link}?width=200" title="{?caption}"></li>
			<!--end-->
		</ul>
	</div>

<!--END-->
</body>
</html>
